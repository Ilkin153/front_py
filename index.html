<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="registration-container">
        <h2>REGISTRATION FORM</h2>
        <form action="#" method="POST">
        <div class="name-row">
            <div class="input-group">
                <label for="firstname">First name</label>
                <input type="text" id="first" name="first" placeholder="" required>
            </div>

            <div class="input-group">
                <label for="lastname">Last name</label>
                <input type="text" id="last" name="last" placeholder="" required>
            </div>
        </div>
            <div class="input-group">
                <label for="emailaddress">Email Address</label>
                <input type="email" id="email" name="email" placeholder="" required>
            </div>

            <div class="input-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" placeholder="" required>
            </div>

            <div class="input-group">
                <label for="country">Country</label>
                <input type="text" id="country" name="country" placeholder="" required>
            </div>

            <div class="input-group">
                </label>Gender</label>
                <div class="gender-container">
                    <input type="radio" id="male" name="gender" checked>
                    <label for="male" class="gender-option"> Male</label>

                    <input type="radio" id="female" name="gender">
                    <label for="female" class="gender-option">Female</label>
                </div>
            </div>

            <button type="submit" class="submit-btn">REGISTER NOW</button>
        </form>                       
    </div>
</body>
</html>
